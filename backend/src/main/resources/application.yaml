spring:
  application:
    name: repo
  # Local dev: read the repo-root .env (KEY=VALUE is valid properties syntax).
  # Real environment variables (CI, prod) take precedence.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    # IF-52: safe for the Supabase transaction pooler (port 6543, PgBouncer/Supavisor transaction mode).
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      data-source-properties:
        # 0 = never use server-side prepared statements; they break under transaction pooling
        # ("prepared statement S_1 already exists").
        prepareThreshold: ${DB_PREPARE_THRESHOLD:0}
  # Schema is owned by supabase/migrations/ (manual §6), not Hibernate or a migration library.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

server:
  # IF-52: finish in-flight requests on SIGTERM; never leak internals in /error responses.
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    # IF-54: every log line carries the request id (empty outside a request).
    level: "%5p [%X{requestId:-}]"

app:
  cache:
    # IF-68: Cache-Control max-age on /api/stats and /api/cards/facets (0 = no header).
    aggregate-max-age: ${API_AGGREGATE_CACHE_MAX_AGE:60s}
  rate-limit:
    # IF-67: per-client-IP token bucket on /api/** (/api/health exempt).
    per-minute: ${API_RATE_LIMIT_PER_MINUTE:120}
    max-clients: ${API_RATE_LIMIT_MAX_CLIENTS:10000}
    # true only when a trusted reverse proxy sets X-Forwarded-For; otherwise clients could spoof it.
    trust-forwarded-for: ${API_TRUST_FORWARDED_FOR:false}
  health:
    # IF-66: query timeout of the select 1 behind GET /api/health.
    db-timeout-seconds: ${HEALTH_DB_TIMEOUT_SECONDS:2}
  cors:
    # Comma-separated list of origins allowed to call the API (the Next.js frontend).
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
