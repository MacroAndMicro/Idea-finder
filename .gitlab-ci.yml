# Merge gate for Idea Finder. Agents may merge an MR only when this pipeline passes.
# Runs on merge requests and on main. Jobs only run when their part of the repo changed.

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  # Free-tier secret scanning: fails loudly if a token/key is committed.
  - template: Jobs/Secret-Detection.gitlab-ci.yml

backend:
  stage: test
  image: eclipse-temurin:21-jdk
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_DB: idea_finder_test
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    DATABASE_URL: jdbc:postgresql://postgres:5432/idea_finder_test
    DATABASE_USER: ci
    DATABASE_PASSWORD: ci
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    fallback_keys: [maven-main]
    paths: [.m2/repository]
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
  rules:
    - changes: [backend/**/*, supabase/**/*, .gitlab-ci.yml]

frontend:
  stage: test
  image: node:22
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
  rules:
    - changes: [frontend/**/*, .gitlab-ci.yml]

scrapers:
  stage: test
  image: python:3.12
  script:
    - pip install --quiet ruff pytest
    - if [ -f scrapers/requirements.txt ]; then pip install --quiet -r scrapers/requirements.txt; fi
    - ruff check scrapers
    # exit code 5 = no tests collected yet; treat as pass until tests exist
    - pytest scrapers || [ $? -eq 5 ]
  rules:
    - exists: [scrapers/**/*.py]
      changes: [scrapers/**/*, .gitlab-ci.yml]
