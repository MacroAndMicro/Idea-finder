[project]
name = "idea-finder-scrapers"
version = "0.1.0"
description = "Idea Finder ingestion adapters and LLM pipeline (Phase 1 sources, official APIs only)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# The importable package is `scrapers` itself, so the repo root goes on sys.path.
pythonpath = [".."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
